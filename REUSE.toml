version = 1
SPDX-PackageName = "agents-js"
SPDX-PackageSupplier = "LiveKit, Inc. <https://livekit.io>"
SPDX-PackageDownloadLocation = "https://github.com/livekit/agents-js"

# trivial files
[[annotations]]
path = [".gitignore", "flake.lock", ".envrc", "packages/livekit-rtc/.gitignore", ".changeset/**", "**/CHANGELOG.md", "NOTICE", ".github/**"]
SPDX-FileCopyrightText = "2024 LiveKit, Inc."
SPDX-License-Identifier = "Apache-2.0"

# pnpm files
[[annotations]]
path = ["pnpm-workspace.yaml", "pnpm-lock.yaml", "patches/**"]
SPDX-FileCopyrightText = "2024 LiveKit, Inc."
SPDX-License-Identifier = "Apache-2.0"

# project configuration files
[[annotations]]
path = [".prettierrc", ".prettierignore", ".eslintrc", "**.json", "**/tsup.config.ts"]
SPDX-FileCopyrightText = "2024 LiveKit, Inc."
SPDX-License-Identifier = "Apache-2.0"

# silero onnx file
[[annotations]]
path = ["**/silero_vad.onnx"]
SPDX-FileCopyrightText = "2024 Silero Team"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

# testing files
[[annotations]]
path = ["**/.gitattributes", "**.wav", "**/__snapshots__/**"]
SPDX-FileCopyrightText = "2024 LiveKit, Inc."
SPDX-License-Identifier = "Apache-2.0"

# audio resources
[[annotations]]
path = ["agents/resources/*.ogg", "agents/resources/NOTICE"]
SPDX-FileCopyrightText = "2024 LiveKit, Inc."
SPDX-License-Identifier = "Apache-2.0"

# LingLang tutor application: original work built on top of the LiveKit SDK
# above, not part of the upstream agents-js package. Dual-licensed under
# AGPL-3.0-or-later — see agents/LICENSE and NOTICE for details.
[[annotations]]
path = ["agents/src/**", "agents/scripts/**", "agents/drizzle/**", "agents/*.ts", "agents/LICENSE"]
SPDX-FileCopyrightText = "2026 the LingLang contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
