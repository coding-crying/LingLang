[project]
name = "linglang-voice"
version = "0.1.0"
description = "LingLang realtime voice pipeline (Pipecat). Owns the voice loop only; the agentic layer stays in Node behind /internal."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "pipecat-ai[livekit,google,webrtc,runner]>=1.7.0,<1.8.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

# Python 3.13, not the system 3.14: pipecat-ai declares >=3.11, but 3.14 is new
# enough that parts of the native dependency chain (onnxruntime, which pipecat
# pulls in as a core dep for Silero VAD) do not reliably ship wheels for it yet.

[tool.setuptools]
py-modules = ["bot", "internal_api", "tools", "check_tool_parity", "join", "smallwebrtc_bot"]
