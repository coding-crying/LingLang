<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LingLang — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('linglang-theme');
        var theme = stored === 'dark' || stored === 'light' ? stored : null;
        if (!theme && window.matchMedia) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        }
        document.documentElement.dataset.theme = theme || 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <style>
    /* Same token values as src/design-tokens.css (kept in sync manually —
       this page is a plain static file outside the Vite bundle, so it
       can't import that file directly). */
    :root,
    [data-theme="dark"] {
      --bg: #141210;
      --bg-radial: #1a1611;
      --surface2: #231e17;
      --border: rgba(255, 240, 220, .08);
      --text: #f1ece3;
      --text-dim: #a39a8c;
      --text-faint: #726a5f;
      --accent: #e8934a;
      --accent-soft: rgba(232, 147, 74, .12);
      --accent-border: rgba(232, 147, 74, .32);
      --bad: #e2695c;
      --shadow: 0 8px 26px rgba(0, 0, 0, .4);
    }
    [data-theme="light"] {
      --bg: #f4efe6;
      --bg-radial: #fdfbf7;
      --surface2: #efe8db;
      --border: rgba(35, 27, 18, .09);
      --text: #231c14;
      --text-dim: #736a5c;
      --text-faint: #9a9082;
      --accent: #c1702e;
      --accent-soft: rgba(193, 112, 46, .1);
      --accent-border: rgba(193, 112, 46, .3);
      --bad: #c14b3d;
      --shadow: 0 8px 22px rgba(40, 30, 20, .14);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 90% at 50% 0%, var(--bg-radial) 0%, var(--bg) 60%);
      color: var(--text);
      font-family: 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 2.5rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    h1 {
      font-family: 'Onest', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }
    p { color: var(--text-dim); margin-bottom: 1.5rem; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      margin-bottom: 0.75rem;
      outline: none;
      transition: border-color .15s ease;
    }
    input:focus { border-color: var(--accent-border); }
    button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 99px;
      background: var(--accent);
      color: var(--bg);
      font-family: 'Onest', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s ease;
    }
    button:hover { opacity: .9; }
    button:active { opacity: .8; }
    .error { color: var(--bad); font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.1em; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>⚡ LingLang</h1>
    <p>Sign in to continue</p>
    <form id="login-form" autocomplete="on">
      <input type="text" id="username" name="username" placeholder="Username" autofocus autocapitalize="off" autocorrect="off">
      <input type="password" id="password" name="password" placeholder="Password">
      <button type="submit">Enter</button>
      <div id="err" class="error"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('err');
      err.textContent = '';
      if (!username || !password) {
        err.textContent = 'Enter a username and password';
        return;
      }
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (r.ok) { window.location.href = '/dashboard'; return; }
        const d = await r.json();
        err.textContent = d.error || 'Login failed';
      } catch (e) { err.textContent = 'Network error'; }
    });
  </script>
</body>
</html>
