<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LingLang — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      color: #e0e0ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 2.5rem;
      width: 360px;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #9090b0; margin-bottom: 1.5rem; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      background: #12122a;
      color: #e0e0ff;
      font-size: 1rem;
      margin-bottom: 0.75rem;
      outline: none;
    }
    input:focus { border-color: #6060cc; }
    button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: #6060cc;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #7070dd; }
    .error { color: #ff6b6b; font-size: 0.85rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>⚡ LingLang</h1>
    <p>Enter your password to continue</p>
    <input type="password" id="pw" placeholder="Password" autofocus>
    <button onclick="login()">Enter</button>
    <div id="err" class="error"></div>
  </div>
  <script>
    async function login() {
      const pw = document.getElementById('pw').value;
      const err = document.getElementById('err');
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'will', password: pw }),
        });
        if (r.ok) { window.location.href = '/dashboard'; return; }
        const d = await r.json();
        err.textContent = d.error || 'Login failed';
      } catch (e) { err.textContent = 'Network error'; }
    }
    document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
