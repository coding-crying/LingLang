name: Container preview
on:
  push:
    branches: [release/container-preview]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: container-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE: ghcr.io/coding-crying/linglang
      VERSION: 0.1.0-preview.1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build preview (not latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.all-in-one
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/coding-crying/linglang:0.1.0-preview.1
          labels: |
            org.opencontainers.image.source=https://github.com/coding-crying/LingLang
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.1.0-preview.1
            org.opencontainers.image.description=Experimental existing-dashboard preview; voice parity not certified
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check packaged files and runtimes
        run: |
          docker run --rm --entrypoint python "$IMAGE:$VERSION" -c 'from pathlib import Path; import shutil; assert shutil.which("node"); assert shutil.which("postgres"); assert list(Path("/opt/initial-schema").glob("*.sql")); bad=[str(p) for p in Path("/app").rglob("*") if "node_modules" not in p.parts and (p.name in (".env",".env.local",".git","runtime_state.json") or p.suffix in (".db",".sqlite",".mp3",".wav"))]; assert not bad,bad; print("Runtime and sensitive-file checks PASS")'
      - name: Test fresh Docker install and recreation
        run: python3 deploy/all-in-one/smoke.py docker "$IMAGE:$VERSION"
      - name: Test rootless Podman with the same image
        run: |
          podman --version
          docker save "$IMAGE:$VERSION" | podman load
          python3 deploy/all-in-one/smoke.py podman "$IMAGE:$VERSION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested preview
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:sha-${GITHUB_SHA}"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-${GITHUB_SHA}"
          docker image inspect "$IMAGE:$VERSION" --format '{{json .RepoDigests}}'
